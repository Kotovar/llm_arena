server:
  host: 127.0.0.1
  port: 3210
dataDir: .data
modelDirectory: models
llamaServer:
  executable: llama-server
  startupTimeoutMs: 900000
nvidiaSmi: nvidia-smi
# Браузер для снимка готового web-приложения. Если его нет, снимок просто не делается.
browser: google-chrome-stable
defaults:
  # Для CLI-agent это максимальная пауза без stdout/stderr, а не общий лимит времени работы.
  taskTimeoutMs: 1800000
  checkTimeoutMs: 600000
  processGraceMs: 10000
  vramReserveMiB: 750
runners:
  - id: llama-chat
    name: llama.cpp Chat
    kind: llama-chat
    exec: [llama-server]
  - id: omp
    name: OMP
    kind: omp
    exec: [omp]
  - id: claude-proxy
    name: Claude Code
    kind: claude-code
    default: true
    exec: [fish, -lc, "claudep $argv", "--"]
  - id: codex-proxy
    name: Codex CLI
    kind: codex
    default: true
    exec: [fish, -lc, "codexp $argv", "--"]
fixtures:
  - id: web-app
    name: Готовое web-приложение
    source: fixtures/web-app
    instructions: |
      Работай в текущей директории как coding-agent. Создай реальные файлы готового web-приложения, а не вставляй реализацию только в итоговый ответ.
      Приложение должно запускаться встроенным статическим preview-сервером: сохрани точку входа в index.html и используй браузерные HTML, CSS и JavaScript без обязательной установки зависимостей.
      Не удаляй server.mjs и check-assets.mjs. Каждый файл, на который ссылается index.html, должен реально существовать рядом: приложение открывают без интернета, поэтому внешние CDN не подойдут.
      После реализации проверь синтаксис созданных JavaScript-файлов. В итоговом ответе кратко перечисли сделанное.
    checks:
      - id: preview-server
        label: Preview server
        command:
          argv: [node, --check, server.mjs]
          timeoutMs: 60000
      - id: app-files
        label: App files
        command:
          argv: [node, check-assets.mjs]
          timeoutMs: 60000
    preview:
      command:
        argv: [node, server.mjs]
        timeoutMs: 120000
      readyPath: /
  - id: node-smoke
    name: Node coding smoke
    source: fixtures/node-smoke
    checks:
      - id: test
        label: Tests
        command:
          argv: [node, --test]
          timeoutMs: 60000
    preview:
      command:
        argv: [node, server.mjs]
        timeoutMs: 120000
      readyPath: /
