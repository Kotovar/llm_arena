server:
  host: 127.0.0.1
  port: 3210
dataDir: .data
llamaServer:
  executable: llama-server
  startupTimeoutMs: 900000
nvidiaSmi: nvidia-smi
defaults:
  taskTimeoutMs: 1800000
  checkTimeoutMs: 600000
  processGraceMs: 10000
  vramReserveMiB: 750
runners:
  - id: llama-chat
    name: llama.cpp Chat
    kind: llama-chat
    exec: [llama-server]
  - id: omp
    name: OMP
    kind: omp
    exec: [omp]
  - id: claude
    name: Claude Code
    kind: claude-code
    exec: [claude]
  - id: claude-proxy
    name: Claude Code (proxy)
    kind: claude-code
    default: true
    exec: [fish, -lc, "claudep $argv", "--"]
  - id: codex
    name: Codex CLI
    kind: codex
    exec: [codex]
  - id: codex-proxy
    name: Codex CLI (proxy)
    kind: codex
    default: true
    exec: [fish, -lc, "codexp $argv", "--"]
fixtures:
  - id: web-app
    name: Готовое web-приложение
    source: fixtures/web-app
    instructions: |
      Работай в текущей директории как coding-agent. Создай реальные файлы готового web-приложения, а не вставляй реализацию только в итоговый ответ.
      Приложение должно запускаться встроенным статическим preview-сервером: сохрани точку входа в index.html и используй браузерные HTML, CSS и JavaScript без обязательной установки зависимостей.
      Не удаляй server.mjs. После реализации проверь синтаксис созданных JavaScript-файлов. В итоговом ответе кратко перечисли сделанное.
    checks:
      - id: preview-server
        label: Preview server
        command:
          argv: [node, --check, server.mjs]
          timeoutMs: 60000
    preview:
      command:
        argv: [node, server.mjs]
        timeoutMs: 120000
      readyPath: /
  - id: node-smoke
    name: Node coding smoke
    source: fixtures/node-smoke
    checks:
      - id: test
        label: Tests
        command:
          argv: [node, --test]
          timeoutMs: 60000
    preview:
      command:
        argv: [node, server.mjs]
        timeoutMs: 120000
      readyPath: /
initialModels:
  - name: Ornith 1.5 35B A3B
    kind: local-gguf
    provider: llama.cpp
    modelRef: ornith
    path: modelsOrnith-1.5-35B-A3B-AD-Q4_K-IQ4_XS.gguf
    alias: ornith
    profiles:
      - name: Quality
        parameters:
          context: 131072
          nGpuLayers: all
          nCpuMoe: 20
          cacheTypeK: q8_0
          cacheTypeV: q8_0
          batchSize: 1024
          ubatchSize: 512
          flashAttention: true
          cacheReuse: 256
