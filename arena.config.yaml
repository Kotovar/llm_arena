server:
  host: 127.0.0.1
  port: 3210
dataDir: .data
modelDirectory: models
llamaServer:
  executable: llama-server
  startupTimeoutMs: 900000
nvidiaSmi: nvidia-smi
# Браузер для снимка готового web-приложения. Если его нет, снимок просто не делается.
browser: google-chrome-stable
defaults:
  # Для CLI-agent это максимальная пауза без stdout/stderr, а не общий лимит времени работы.
  taskTimeoutMs: 1800000
  checkTimeoutMs: 600000
  processGraceMs: 10000
  vramReserveMiB: 750
  # Прогон с локальной моделью останавливается, если видеокарта держит эту температуру
  # несколько секунд подряд: столько она уже работает в троттлинге, и результаты замеров
  # всё равно испорчены. 0 — не следить за температурой.
  gpuMaxTemperatureC: 87
runners:
  - id: llama-chat
    name: llama.cpp Chat
    kind: llama-chat
    exec: [llama-server]
  - id: omp
    name: OMP
    kind: omp
    exec: [omp]
  - id: claude-proxy
    name: Claude Code
    kind: claude-code
    default: true
    exec: [fish, -lc, "claudep $argv", "--"]
  - id: codex-proxy
    name: Codex CLI
    kind: codex
    default: true
    exec: [fish, -lc, "codexp $argv", "--"]
  - id: opencode
    name: OpenCode
    kind: opencode
    default: true
    exec: [opencode]
fixtures:
  - id: web-app
    name: Готовое web-приложение
    source: fixtures/web-app
    instructions: |
      Work in the current directory as a coding agent. Create real files of a finished web application instead of putting the implementation only in your final answer.
      The application must run under the built-in static preview server: keep the entry point in index.html and use plain browser HTML, CSS and JavaScript that needs no dependency installation.
      Do not delete server.mjs or check-assets.mjs. Every file referenced by index.html must actually exist next to it: the application is opened without internet access, so external CDNs will not work.
      Split the code into index.html, styles.css and app.js instead of one huge file. Write at most about 150 lines per tool call and append long content in parts.
      After implementing, check the syntax of the JavaScript files you created. In the final answer briefly list what you did.
    checks:
      - id: preview-server
        label: Preview server syntax
        command:
          argv: [node, --check, server.mjs]
          timeoutMs: 60000
      - id: app-files
        label: App files
        command:
          argv: [node, check-assets.mjs]
          timeoutMs: 60000
    preview:
      command:
        argv: [node, server.mjs]
        timeoutMs: 120000
      readyPath: /
  - id: node-smoke
    name: Node coding smoke
    source: fixtures/node-smoke
    checks:
      - id: test
        label: Tests
        command:
          argv: [node, --test]
          timeoutMs: 60000
    preview:
      command:
        argv: [node, server.mjs]
        timeoutMs: 120000
      readyPath: /
